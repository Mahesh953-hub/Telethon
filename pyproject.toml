[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Telethon"
dynamic = ["version"]
description = "Full-featured Telegram client library for Python 3"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.5"
authors = [
    { name = "Lonami Exo", email = "totufals@hotmail.com" },
]
keywords = [
    "api",
    "chat",
    "client",
    "library",
    "messaging",
    "mtproto",
    "telegram",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "pyaes",
    "rsa",
]

[project.optional-dependencies]
cryptg = [
    "cryptg",
]

[project.urls]
Homepage = "https://telethon.dev"
Source = "https://codeberg.org/Lonami/Telethon"
Download = "https://codeberg.org/Lonami/Telethon/tags"
Documentation = "https://docs.telethon.dev"
Reference = "https://tl.telethon.dev"

[tool.hatch.version]
path = "telethon/version.py"

[tool.hatch.build.targets.wheel]
packages = ["telethon"]

[tool.hatch.build.targets.sdist]
include = [
    "/telethon",
]
[tool.hatch.build.hooks.custom]

[tool.ruff]
line-length = 100
# Keep this in step with `requires-python` in this file. It is what makes
# UP/pyupgrade flag APIs newer than the floor, which is how `str.removeprefix`
# (3.9+) would have been caught before it shipped.
target-version = "py38"

# Deliberately narrow: syntax and name-resolution errors only, so this stays
# green on a codebase that predates linting. The wider set
# (E4,E7,E9,F,W,B,SIM,I) is applied to the files this branch touches.
[tool.ruff.lint]
# UP004/UP008/UP015/UP018/UP024/UP028/UP030/UP032 are cosmetic f-string and
# bytes-literal rewrites; the codebase uses `.format()` throughout, so they
# would be churn without value.
#
# Note: ruff does NOT flag calls to stdlib methods newer than
# `target-version` (e.g. `str.removeprefix`, which is 3.9+), even with
# `--select ALL`. That class of bug is caught by
# tests/telethon/client/test_review_fixes.py::TestPythonFloor, which parses
# the module AST. Keep `target-version` in step with `requires-python`.
select = ["E9", "F63", "F7", "F82", "UP003", "UP004", "UP009", "UP010",
          "UP011", "UP012", "UP013", "UP014", "UP015", "UP017", "UP020",
          "UP021", "UP022", "UP023", "UP024", "UP025", "UP028", "UP030",
          "UP031", "UP032"]
ignore = ["UP032", "UP031", "UP030", "UP028", "UP024"]

[tool.ruff.lint.per-file-ignores]
# Untouched legacy files kept as-is rather than churning a PR about
# something else. Re-enable these when the files are revisited.
"readthedocs/conf.py" = ["UP009", "UP015"]
"setup.py" = ["UP015"]
